name: Build SpearElytra

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpearElytra-JAR
          path: target/*.jar
